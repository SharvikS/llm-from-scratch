# Tiny config, identical to tiny.yaml but with RoPE positional encoding.
# Used for the sinusoidal-vs-RoPE comparison in Phase 13.
vocab_size: 65
d_model: 128
n_heads: 4
n_layers: 4
d_ff: 512
block_size: 128
dropout: 0.1
pos_encoding: rope
batch_size: 64
gradient_accumulation_steps: 1
max_steps: 5000
eval_interval: 250
save_interval: 1000
learning_rate: 3e-4
weight_decay: 0.1
warmup_steps: 100
min_lr: 3e-5
